name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Artifacts
        run: gh run download $(gh run list --repo thecaliskan/oort  --workflow build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId') --repo thecaliskan/oort --dir ./source/_data --pattern "sarif-*" --pattern "sbom-*" --pattern "php-extensions-*"
        env:
          GITHUB_TOKEN: ${{ secrets.OORT_GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build documentation
        run: make html

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
